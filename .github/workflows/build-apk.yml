name: build-apk

# Builds the installable Android app (APK) with the newest trained model and publishes it as a release.
# Runs when app files change, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare app files (도감, runtime, fonts, newest model)
        run: |
          python3 app/data_src/build_db.py
          bash app/fetch_deps.sh
          bash app/fetch_model.sh

      - name: Add 도감 photos for entries the AI model has none for
        run: |
          python3 -m pip install --quiet requests pillow
          python3 app/fetch_extra_refs.py

      - name: Build APK
        run: |
          MODEL="$(cat app/www/model/VERSION)"
          bash app/android/build.sh app/www sanyacho.apk "${GITHUB_RUN_NUMBER}" "1.${GITHUB_RUN_NUMBER} (${MODEL})"

      - name: Publish release
        run: |
          MODEL="$(cat app/www/model/VERSION)"
          printf '휴대폰에서 아래 **sanyacho.apk**를 눌러 받은 뒤 설치하세요.\n\n- AI 모델: %s\n- 인터넷 없이 동작합니다.\n- 확실하지 않으면 먹지 마세요. 버섯은 먹지 마세요.\n' "$MODEL" > notes.md
          gh release create "app-v${GITHUB_RUN_NUMBER}" sanyacho.apk --title "산야초 길잡이 1.${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest
